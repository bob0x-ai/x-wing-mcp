[project]
name = "x-wing-mcp"
version = "0.1.0"
description = "X (Twitter) MCP server exposing x-wing write tools and x_data read tools"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0",
    "xdk>=0.9.0",
    "python-dotenv>=1.0.0",
    "requests>=2.28.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-vcr>=1.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["x_client", "oauth_setup", "server", "x_usage_ledger"]
packages = ["xdata", "xdata.providers"]
